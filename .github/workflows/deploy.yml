name: Deploy theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-theme-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production theme
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build theme
        run: pnpm lint && pnpm format:check && pnpm build

      - name: Install password authentication helper
        run: sudo apt-get update && sudo apt-get install --yes sshpass

      - name: Deploy theme
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          THEME_SLUG="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; console.log(packageJson.name)')"
          sshpass -e rsync -az --delete-delay --delay-updates \
            -e "ssh -p $DEPLOY_PORT -o StrictHostKeyChecking=accept-new" \
            "release/$THEME_SLUG/" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
