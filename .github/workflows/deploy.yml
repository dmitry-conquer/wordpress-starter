name: Deploy theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-theme-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy production theme
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build theme
        run: pnpm lint && pnpm format:check && pnpm build

      - name: Install SFTP deployment client
        run: sudo apt-get update && sudo apt-get install --yes lftp

      - name: Deploy theme
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LFTP_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          THEME_SLUG="$(node --input-type=module -e 'import packageJson from "./package.json" with { type: "json" }; console.log(packageJson.name)')"
          lftp --env-password -u "$DEPLOY_USER" "sftp://$DEPLOY_HOST:$DEPLOY_PORT" <<EOF
          set cmd:fail-exit true
          set sftp:auto-confirm true
          set mirror:set-permissions false
          mirror --reverse --delete --verbose "release/$THEME_SLUG/" "$DEPLOY_PATH/"
          bye
          EOF
